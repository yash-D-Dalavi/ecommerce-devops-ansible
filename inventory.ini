# ---------- Web Tier ----------
[webservers]
web01 ansible_host=127.0.0.1

# ---------- Database Tier ----------
[dbservers]
db01 ansible_host=127.0.0.1

# ---------- Monitoring Tier ----------
[monitoring]
mon01 ansible_host=127.0.0.1

# ---------- Parent Group (Production Environment) ----------
[production:children]
webservers
dbservers
monitoring

# ---------- Global Variables ----------
[production:vars]
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
env_name=production